name: Build WebDriverAgent IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Pick newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Checkout appium/WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master

      - name: Build WDA (unsigned)
        run: |
          set -e
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package into WebDriverAgent.ipa (strip embedded XCTest frameworks, Appium way)
        run: |
          set -e
          APP=$(find ./DerivedData/Build/Products -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Runner app: $APP"
          FW="$APP/Frameworks"
          echo "=== Frameworks BEFORE ==="; ls "$FW" 2>/dev/null || true
          rm -rf "$FW"/XC*.framework "$FW"/Testing.framework "$FW"/libXCTestSwiftSupport.dylib 2>/dev/null || true
          echo "=== Frameworks AFTER ==="; ls "$FW" 2>/dev/null || true
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -r WebDriverAgent.ipa Payload >/dev/null
          ls -la WebDriverAgent.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa
          path: WebDriverAgent.ipa
          retention-days: 7
